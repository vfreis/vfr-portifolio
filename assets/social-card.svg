<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Vinicios Falqueiro Reis — Data Engineer + Applied AI</title>
  <desc id="desc">Professional portfolio social preview with Data Engineering, AWS, PySpark, Airflow and Applied AI positioning.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0d2138"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7dd3fc"/><stop offset=".55" stop-color="#dcf7ff"/><stop offset="1" stop-color="#c4b5fd"/></linearGradient>
  </defs>
  <rect width="1200" height="630" rx="0" fill="url(#bg)"/>
  <circle cx="1050" cy="100" r="250" fill="#7dd3fc" opacity=".035"/>
  <circle cx="1000" cy="560" r="300" fill="#c4b5fd" opacity=".035"/>
  <text x="80" y="105" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="3">DATA ENGINEER · APPLIED AI &amp; ML</text>
  <text x="80" y="210" fill="#f4f8fc" font-family="Arial,sans-serif" font-size="68" font-weight="700">Vinicios Falqueiro Reis</text>
  <text x="80" y="290" fill="url(#accent)" font-family="Arial,sans-serif" font-size="46" font-weight="700">Scale → Reliability → Business Impact</text>
  <text x="80" y="360" fill="#9eb4c9" font-family="Arial,sans-serif" font-size="25">AWS · PySpark · Airflow · Python · SQL · FastAPI · Applied AI</text>
  <g transform="translate(80 430)">
    <rect width="190" height="92" rx="18" fill="#0c1b2d" stroke="#24405d"/><text x="24" y="40" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="28" font-weight="700">10+ TB</text><text x="24" y="67" fill="#93a9bd" font-family="Arial,sans-serif" font-size="16">processed / month</text>
    <rect x="210" width="190" height="92" rx="18" fill="#0c1b2d" stroke="#24405d"/><text x="234" y="40" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="28" font-weight="700">-20%</text><text x="234" y="67" fill="#93a9bd" font-family="Arial,sans-serif" font-size="16">pipeline runtime</text>
    <rect x="420" width="190" height="92" rx="18" fill="#0c1b2d" stroke="#24405d"/><text x="444" y="40" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="28" font-weight="700">95%</text><text x="444" y="67" fill="#93a9bd" font-family="Arial,sans-serif" font-size="16">workflows automated</text>
