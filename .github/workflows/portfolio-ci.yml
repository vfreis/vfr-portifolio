name: Portfolio CI

on:
  pull_request:
  push:
    branches:
      - main
      - portfolio-2-0-foundation

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate site structure
        run: python scripts/validate_site.py

      - name: Validate JavaScript syntax
        run: node --check js/app.js
