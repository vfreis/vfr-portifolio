name: One-off switch to native GitHub Pages URL

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/switch-to-github-pages-url.yml'

permissions:
  contents: write

jobs:
  switch-url:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Replace index metadata URL
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          updated = text.replace(
              'https://viniciosfalqueiro.dev/',
              'https://vfreis.github.io/vfr-portifolio/',
          )
          if updated == text:
              print('Index metadata already uses the native GitHub Pages URL.')
          else:
              path.write_text(updated, encoding='utf-8')
          PY

      - name: Validate native Pages URL
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq 'https://vfreis.github.io/vfr-portifolio/' index.html
          ! grep -Fq 'https://viniciosfalqueiro.dev/' index.html
          test ! -e CNAME
          python scripts/validate_site.py
          node --check js/app.js
          node --check js/analytics.js

      - name: Commit URL switch
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No index change required.'
            exit 0
          fi
          git commit -m 'fix: use native GitHub Pages URL'
          git push origin HEAD:main
